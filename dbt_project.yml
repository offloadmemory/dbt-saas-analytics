
name: 'hello_dbt'
version: '2.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'hello_dbt'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Seeds land in the target schema (`main` by default). The source declarations
# in models/staging/_sources.yml point at `main.<table>` accordingly.

# Layer-level materialization. Staging and intermediate are views (cheap to
# rebuild, easy to inspect in DuckDB). Marts are tables so downstream consumers
# (BI tools, notebooks) get a stable physical artifact.
models:
  hello_dbt:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

# dbt-project-evaluator overrides a small set of dbt core macros so the audit
# can run on adapters (including DuckDB) that need cross-database shims. This
# dispatch block tells dbt to look in the package's macros first.
dispatch:
  - macro_namespace: dbt
    search_order: ['dbt_project_evaluator', 'dbt']

# Hide installed-package models from `dbt docs` so the lineage graph only
# shows this project's models. The package still runs via `uv run poe audit`.
flags:
  show_package_models: false
