hello_dbt:
  target: dev
  outputs:
    dev:
      type: databricks
      # All four connection values come from env vars so this file stays
      # committable. See README.md → Configuration for where to find each
      # value in the Databricks UI.
      host:     "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      token:    "{{ env_var('DBT_DATABRICKS_TOKEN') }}"
      catalog:  "{{ env_var('DBT_DATABRICKS_CATALOG') }}"
      schema:   "{{ env_var('DBT_DATABRICKS_SCHEMA', 'default') }}"
      threads: 4
