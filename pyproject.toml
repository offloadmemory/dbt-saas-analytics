[project]
name = "dbt-saas-analytics"
version = "2.0.0"
description = "A reference dbt + Databricks project that loads Hubspot, Stripe, and Zoho CSV seeds into Unity Catalog and exposes a clean staging → intermediate → marts model with per-domain organization."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "dbt-saas-analytics maintainers" },
]
dependencies = [
    "dbt-core~=1.10",
    "dbt-databricks~=1.10",
    "faker",
    "poethepoet>=0.32",
    "python-dotenv>=1.0",
]

[project.scripts]
# None today — dbt is invoked through the poe tasks below.

# ----------------------------------------------------------------------
# uv configuration
# ----------------------------------------------------------------------
# uv is the project's package manager. `uv sync` installs dependencies
# into a project-local .venv and respects uv.lock. `uv run poe <task>`
# runs a task in that environment.
# ----------------------------------------------------------------------

[tool.uv]
# Pin a package manager version so contributors get reproducible uv behavior.
required-version = ">=0.5"

[tool.uv.build-backend]
module-name = "hello_dbt"
module-root = ""

# ----------------------------------------------------------------------
# poethepoet tasks
# ----------------------------------------------------------------------
# Run with `uv run poe <task>` (e.g. `uv run poe build`).
# ----------------------------------------------------------------------

[tool.poe.tasks]
# Sanity check: profile found, adapter connects. Reads `.env` via dbt_runner.
debug = "python dbt_runner.py debug"

# Full local build: load seeds, then build all models. Implemented as a
# script-style task so the workflow is encoded in build.py and easy to read.
build = { script = "build" }

# Run schema tests against the built models.
test = "python dbt_runner.py test"

# Run the standalone Faker-based sample generator. Writes
# stripe_payments_sample.csv next to the script; the dbt pipeline itself
# reads from seeds/stripe_payments.csv, not from this file.
seed-sample = "python seeder.py"

# Build dbt docs (target/manifest.json + target/catalog.json + index.html).
# Run `uv run poe docs-serve` separately to browse at http://localhost:8080.
# Only this project's models appear in the lineage graph (no packages installed).
docs = "python dbt_runner.py docs generate"

# Serve the generated docs locally at http://localhost:8080. Re-runs are safe;
# dbt will refuse to start if the port is already taken.
docs-serve = "dbt docs serve --port 8080 --no-browser"

# Convenience: build + test in one command.
all = [
    { cmd = "poe build" },
    { cmd = "poe test" },
]
