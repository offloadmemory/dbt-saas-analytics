version: 2

models:
  - name: dim_customers
    description: >
      One row per unique customer email, with rolled-up totals across
      Hubspot deals, Stripe payments, and Zoho orders. Surrogate key is
      md5(email).
    columns:
      - name: customer_id
        description: "Surrogate key: md5(customer_email)."
        tests:
          - unique
          - not_null
      - name: customer_email
        description: "Lower-cased email. The natural key."
        tests:
          - unique
          - not_null
      - name: first_deal_date
        description: "Earliest close_date across this customer's Hubspot deals."
      - name: first_payment_date
        description: "Earliest created_at across this customer's Stripe payments."
      - name: first_order_date
        description: "Earliest order_date across this customer's Zoho orders."
      - name: total_deal_amount
        description: "Sum of deal amounts (USD) for this customer."
      - name: total_payment_amount
        description: "Sum of payment amounts (mixed currency; reported as-is) for this customer."
      - name: total_order_amount
        description: "Sum of order totals for this customer."

  - name: fct_won_deals
    description: >
      Hubspot deals filtered to stage = 'Closed-Won', enriched with the
      customer's first Stripe payment timestamp and the customer dimension.
      Replaces the original models/legacy/won_deals.sql.
    columns:
      - name: deal_id
        description: "Primary key."
        tests:
          - unique
          - not_null
      - name: deal_name
        description: "Human-readable deal name."
      - name: deal_owner
        description: "Sales rep who owns the deal."
      - name: amount
        description: "Deal amount in USD."
        tests:
          - not_null
      - name: close_date
        description: "Close date for the deal."
      - name: customer_email
        description: "Customer email."
        tests:
          - not_null
      - name: customer_id
        description: "Surrogate key from dim_customers."
        tests:
          - not_null
      - name: first_payment_at
        description: "Earliest Stripe payment timestamp for the customer; null if no payments."
      - name: days_to_first_payment
        description: "close_date - first_payment_at (in days); null if no payments."
