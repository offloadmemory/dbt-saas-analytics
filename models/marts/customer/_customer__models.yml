version: 2

models:
  - name: dim_customers
    description: >
      One row per unique customer email, with rolled-up totals across
      Hubspot deals, Stripe payments, and Zoho orders. Surrogate key is
      md5(email).
    config:
      tags: [customer]
    columns:
      - name: customer_id
        description: "Surrogate key: md5(customer_email)."
        tests:
          - unique
          - not_null
      - name: customer_email
        description: "Lower-cased email. The natural key."
        tests:
          - unique
          - not_null
      - name: first_deal_date
        description: "Earliest close_date across this customer's Hubspot deals."
      - name: first_payment_date
        description: "Earliest created_at across this customer's Stripe payments."
      - name: first_order_date
        description: "Earliest order_date across this customer's Zoho orders."
      - name: total_deal_amount
        description: "Sum of deal amounts (USD) for this customer."
      - name: total_payment_amount
        description: "Sum of payment amounts (mixed currency; reported as-is) for this customer."
      - name: total_order_amount
        description: "Sum of order totals for this customer."

  - name: fct_customer_engagement
    description: >
      One row per customer with engagement signals across all three
      source systems: deal touchpoints, payment activity, and order
      history. Useful for the customer support / success VP who needs
      to know "who is engaging with us, how much, and when."
      When a real support source is added (e.g. Zendesk, Intercom),
      extend this mart with ticket-level metrics.
    config:
      tags: [customer]
    columns:
      - name: customer_id
        description: "Surrogate key from dim_customers."
        tests:
          - unique
          - not_null
      - name: customer_email
        description: "Customer email."
        tests:
          - not_null
      - name: deal_count
        description: "Number of Hubspot deals on file for this customer."
        tests:
          - not_null
      - name: total_deal_amount
        description: "Sum of deal amounts (USD) for this customer."
        tests:
          - not_null
      - name: last_deal_date
        description: "Most recent close_date for this customer."
      - name: payment_count
        description: "Number of Stripe payments for this customer."
        tests:
          - not_null
      - name: total_payment_amount
        description: "Sum of payment amounts for this customer."
        tests:
          - not_null
      - name: last_payment_at
        description: "Most recent payment timestamp for this customer."
      - name: order_count
        description: "Number of Zoho orders for this customer."
        tests:
          - not_null
      - name: total_order_amount
        description: "Sum of order totals for this customer."
        tests:
          - not_null
      - name: last_order_date
        description: "Most recent order date for this customer."
      - name: last_engagement_at
        description: "Most recent activity across deals, payments, orders."
        tests:
          - not_null
