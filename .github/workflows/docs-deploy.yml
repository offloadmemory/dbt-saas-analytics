name: Publish dbt docs

# Re-run on every push to main, or trigger manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress run when a new commit lands. Pages deployments
# are sequential; running two in parallel would just confuse the deploy.
concurrency:
  group: pages
  cancel-in-progress: true

# Restrict default token permissions, then explicitly grant what the
# deploy needs (GitHub Pages).
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: dbt deps
        run: uv run dbt deps

      - name: dbt debug
        run: uv run poe debug

      - name: dbt seed
        run: uv run dbt seed

      - name: dbt run
        run: uv run dbt run

      - name: dbt test
        run: uv run poe test

      - name: Generate docs
        run: uv run dbt docs generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/

  deploy:
    # The official deploy action needs the build to have finished and
    # uploaded the artifact. We pin to the github-pages environment.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
